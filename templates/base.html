<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}可予礼品有限公司{% endblock %} · 竞品监控平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #8B2942;
            --brand-light: #A83350;
            --brand-dark: #6E1F33;
            --brand-glow: rgba(139, 41, 66, 0.12);
            --gold: #C9A961;
            --gold-light: #E8D5A3;
            --gold-pale: #F9F3E3;
            --gold-glow: rgba(201, 169, 97, 0.15);
            --bg: #F9F7F4;
            --bg-warm: #F5F0EA;
            --card-bg: #FFFFFF;
            --glass-bg: rgba(255,255,255,0.82);
            --text: #1E1E1E;
            --text-secondary: #5C5C5C;
            --text-muted: #949494;
            --border: #E8E3DD;
            --border-light: #F0ECE7;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
            --shadow: 0 4px 16px rgba(0,0,0,0.05), 0 1px 4px rgba(0,0,0,0.04);
            --shadow-hover: 0 12px 32px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
            --shadow-lg: 0 20px 48px rgba(0,0,0,0.1), 0 4px 12px rgba(0,0,0,0.05);
            --radius: 14px;
            --radius-sm: 10px;
            --radius-xs: 7px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* === Sidebar === */
        .sidebar {
            position: fixed; left: 0; top: 0; bottom: 0;
            width: 250px; z-index: 100;
            background: linear-gradient(195deg, #1F1410 0%, #2D1A14 30%, #1A0D0A 100%);
            display: flex; flex-direction: column;
            box-shadow: 4px 0 32px rgba(0,0,0,0.25);
            border-right: 1px solid rgba(255,255,255,0.04);
        }
        .sidebar::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201,169,97,0.3), transparent);
        }

        .sidebar-brand {
            padding: 32px 24px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: relative;
        }
        .sidebar-brand .brand-icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: linear-gradient(135deg, var(--brand), var(--brand-dark));
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; margin-bottom: 14px;
            box-shadow: 0 4px 16px rgba(139,41,66,0.35);
        }
        .sidebar-brand h1 {
            font-family: 'Noto Serif SC', serif;
            color: #FFFFFF;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1.5px;
            line-height: 1.3;
        }
        .sidebar-brand .subtitle {
            font-family: 'Inter', sans-serif;
            color: rgba(255,255,255,0.35);
            font-size: 10.5px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        .sidebar-nav { flex: 1; padding: 20px 14px; overflow-y: auto; }
        .sidebar-nav .nav-section {
            font-size: 10px; text-transform: uppercase; letter-spacing: 2px;
            color: rgba(255,255,255,0.22); padding: 16px 14px 8px; font-weight: 600;
        }
        .sidebar-nav a {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px; margin-bottom: 2px;
            border-radius: var(--radius-xs);
            color: rgba(255,255,255,0.55);
            text-decoration: none;
            font-size: 13.5px; font-weight: 400;
            transition: var(--transition);
            position: relative;
        }
        .sidebar-nav a:hover {
            background: rgba(255,255,255,0.07);
            color: rgba(255,255,255,0.85);
        }
        .sidebar-nav a.active {
            background: rgba(201,169,97,0.12);
            color: var(--gold);
            font-weight: 500;
        }
        .sidebar-nav a.active::before {
            content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
            width: 3px; border-radius: 0 3px 3px 0;
            background: var(--gold);
        }
        .sidebar-nav a .nav-icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
        .sidebar-nav a.guide-link { color: #FF8A8A; }
        .sidebar-nav a.guide-link:hover { background: rgba(255,138,138,0.12); color: #FFAAAA; }
        .sidebar-nav a.create-link { color: var(--gold-light); }
        .sidebar-nav a.create-link:hover { background: rgba(201,169,97,0.12); color: var(--gold); }

        .sidebar-footer {
            padding: 20px 24px; border-top: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.28); font-size: 11px;
            line-height: 1.7;
        }

        /* === Main Area === */
        .main { margin-left: 250px; min-height: 100vh; }

        .page-header {
            background: var(--card-bg); padding: 24px 36px;
            border-bottom: 1px solid var(--border-light);
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            position: sticky; top: 0; z-index: 50;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(255,255,255,0.9);
        }
        .page-header h2 {
            font-family: 'Noto Serif SC', serif;
            font-size: 22px; color: var(--brand-dark);
            font-weight: 600; letter-spacing: 0.5px;
        }
        .page-header .breadcrumb {
            font-size: 12.5px; color: var(--text-muted); margin-top: 4px;
            letter-spacing: 0.3px;
        }

        .content { padding: 32px 36px 40px; }

        /* === Stat Cards === */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card {
            background: var(--card-bg); border-radius: var(--radius);
            padding: 26px 28px; box-shadow: var(--shadow);
            position: relative; overflow: hidden;
            transition: var(--transition);
            border: 1px solid var(--border-light);
        }
        .stat-card::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--brand), var(--brand-light));
            opacity: 0; transition: var(--transition);
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .stat-card:hover::after { opacity: 1; }
        .stat-card.gold::after { background: linear-gradient(90deg, var(--gold), var(--gold-light)); }
        .stat-card.pink::after { background: linear-gradient(90deg, #E8547E, #F08090); }
        .stat-card.blue::after { background: linear-gradient(90deg, #4A7FE0, #7398E8); }
        .stat-card.warm::after { background: linear-gradient(90deg, #E0A840, #ECC860); }

        .stat-card .stat-icon { font-size: 28px; margin-bottom: 12px; display: block; }
        .stat-card .label { font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; letter-spacing: 0.3px; }
        .stat-card .value {
            font-family: 'Noto Serif SC', 'Inter', serif;
            font-size: 34px; font-weight: 700; color: var(--text);
            letter-spacing: -0.5px; line-height: 1;
        }
        .stat-card.gold .value { color: #B8953A; }
        .stat-card .extra { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

        /* === Content Cards === */
        .card {
            background: var(--card-bg); border-radius: var(--radius);
            padding: 28px; box-shadow: var(--shadow); margin-bottom: 24px;
            border: 1px solid var(--border-light);
            transition: var(--transition);
        }
        .card:hover { box-shadow: var(--shadow-hover); }

        .card-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; padding-bottom: 16px;
            border-bottom: 1px solid var(--border-light);
        }
        .card-header h3 {
            font-family: 'Noto Serif SC', serif;
            font-size: 17px; color: var(--brand-dark);
            font-weight: 600; letter-spacing: 0.3px;
            display: flex; align-items: center; gap: 10px;
        }
        .card-header h3 .card-icon { font-size: 20px; }

        /* === Table === */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        th {
            text-align: left; padding: 12px 14px;
            font-size: 11.5px; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.6px;
            border-bottom: 2px solid var(--border);
            background: var(--bg-warm);
            border-radius: var(--radius-xs) var(--radius-xs) 0 0;
        }
        td { padding: 13px 14px; border-bottom: 1px solid var(--border-light); }
        tbody tr { transition: background 0.15s; }
        tbody tr:hover { background: rgba(249, 243, 227, 0.4); }

        .badge {
            display: inline-block; padding: 4px 12px; border-radius: 20px;
            font-size: 11.5px; font-weight: 500; letter-spacing: 0.2px;
        }
        .badge-taobao { background: #FFF4EC; color: #E06A20; border: 1px solid rgba(224,106,32,0.15); }
        .badge-douyin { background: #F0F0F5; color: #3C3C50; border: 1px solid rgba(60,60,80,0.1); }
        .badge-xhs { background: #FFF0F5; color: #E8547E; border: 1px solid rgba(232,84,126,0.15); }
        .badge-dianping { background: #FFF8EC; color: #C09530; border: 1px solid rgba(192,149,48,0.15); }

        .rank-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 30px; height: 30px; border-radius: 50%;
            font-size: 13px; font-weight: 700; color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .rank-badge.normal { background: var(--brand); }
        .rank-badge.top1 { background: linear-gradient(135deg, #FFD700, #F0A500); box-shadow: 0 2px 12px rgba(255,215,0,0.35); }
        .rank-badge.top2 { background: linear-gradient(135deg, #C8C8C8, #A8A8A8); box-shadow: 0 2px 12px rgba(192,192,192,0.35); }
        .rank-badge.top3 { background: linear-gradient(135deg, #CD7F32, #B8702A); box-shadow: 0 2px 12px rgba(205,127,50,0.35); }

        .price-tag { font-weight: 600; color: var(--brand); font-family: 'Inter', sans-serif; }
        .link-text a {
            color: var(--brand); text-decoration: none;
            font-size: 12.5px; transition: color 0.2s; font-weight: 500;
        }
        .link-text a:hover { color: var(--brand-light); text-decoration: underline; }

        /* === Tabs === */
        .tabs { display: inline-flex; gap: 4px; background: var(--bg-warm); border-radius: 10px; padding: 4px; }
        .tab {
            padding: 9px 22px; border-radius: 8px; border: none;
            font-size: 13.5px; cursor: pointer; background: transparent;
            color: var(--text-secondary); transition: var(--transition);
            font-weight: 500; font-family: inherit;
        }
        .tab.active {
            background: white; color: var(--brand); font-weight: 600;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .tab:hover:not(.active) { color: var(--text); background: rgba(255,255,255,0.5); }

        /* === Guide Banner === */
        .guide-banner {
            background: linear-gradient(135deg, #FFF5F7 0%, #FAF1E6 50%, #FCF8F0 100%);
            border-radius: var(--radius); padding: 26px 32px;
            margin-bottom: 32px; display: flex; align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(201,169,97,0.2);
            box-shadow: var(--shadow);
        }
        .guide-banner .text h3 {
            font-family: 'Noto Serif SC', serif; font-size: 18px;
            color: var(--brand-dark); font-weight: 600;
        }
        .guide-banner .text p { font-size: 13.5px; color: var(--text-secondary); margin-top: 4px; }
        .guide-banner .btn {
            padding: 11px 26px; border-radius: var(--radius-xs); border: none;
            font-size: 14px; font-weight: 600; cursor: pointer;
            background: linear-gradient(135deg, var(--brand), var(--brand-light));
            color: white; transition: var(--transition);
            text-decoration: none; display: inline-block;
            box-shadow: 0 4px 14px rgba(139,41,66,0.3);
            letter-spacing: 0.3px;
        }
        .guide-banner .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(139,41,66,0.4);
        }

        /* === Buttons === */
        .btn {
            padding: 9px 20px; border-radius: var(--radius-xs); border: none;
            font-size: 13.5px; font-weight: 500; cursor: pointer;
            transition: var(--transition); font-family: inherit;
            letter-spacing: 0.2px; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--brand), var(--brand-light));
            color: white; box-shadow: 0 2px 8px rgba(139,41,66,0.25);
        }
        .btn-primary:hover {
            box-shadow: 0 4px 14px rgba(139,41,66,0.35);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: white; color: var(--brand);
            border: 1.5px solid rgba(139,41,66,0.25);
        }
        .btn-outline:hover { background: #FFF5F7; border-color: var(--brand); }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold), #B8954A);
            color: white; box-shadow: 0 2px 8px rgba(201,169,97,0.3);
        }
        .btn-gold:hover {
            box-shadow: 0 4px 14px rgba(201,169,97,0.4);
            transform: translateY(-1px);
        }
        .btn-danger { background: #E8547E; color: white; }
        .btn-danger:hover { background: #D43D68; }

        .empty-state {
            text-align: center; padding: 64px 24px; color: var(--text-muted);
        }
        .empty-state .empty-icon { font-size: 52px; margin-bottom: 16px; opacity: 0.7; }
        .empty-state p { font-size: 15px; }

        /* === Filter Bar === */
        .filter-bar {
            display: flex; gap: 12px; align-items: center;
        }
        .filter-bar select, .filter-bar input {
            padding: 9px 16px; border: 1.5px solid var(--border);
            border-radius: var(--radius-xs); font-size: 13.5px; color: var(--text);
            background: white; font-family: inherit;
            transition: border-color 0.2s;
        }
        .filter-bar select:focus, .filter-bar input:focus {
            outline: none; border-color: var(--brand);
            box-shadow: 0 0 0 3px var(--brand-glow);
        }

        /* === Footer === */
        .footer-text {
            text-align: center; padding: 48px 0 28px;
            color: var(--text-muted); font-size: 12.5px;
            letter-spacing: 0.3px;
        }

        /* === Scrollbar === */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.2); }

        /* === Animations === */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fadeInUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        .delay-1 { animation-delay: 0.05s; }
        .delay-2 { animation-delay: 0.1s; }
        .delay-3 { animation-delay: 0.15s; }
        .delay-4 { animation-delay: 0.2s; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">🎁</div>
            <h1>可予礼品有限公司</h1>
            <div class="subtitle">Competitive Intelligence</div>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="{{ 'active' if request.path == '/' else '' }}">
                <span class="nav-icon">📊</span> 数据概览
            </a>
            <a href="/rankings" class="{{ 'active' if request.path == '/rankings' else '' }}">
                <span class="nav-icon">🏆</span> 销量排行
            </a>
            <a href="/viral" class="{{ 'active' if request.path == '/viral' else '' }}">
                <span class="nav-icon">🔥</span> 爆款内容
            </a>
            <a href="/age" class="{{ 'active' if request.path == '/age' else '' }}">
                <span class="nav-icon">👥</span> 消费者画像
            </a>
            <a href="/trends" class="{{ 'active' if request.path == '/trends' else '' }}">
                <span class="nav-icon">📈</span> 行业趋势
            </a>
            <a href="/merchants" class="{{ 'active' if request.path == '/merchants' else '' }}">
                <span class="nav-icon">🏪</span> 跟踪商家
            </a>
            <div class="nav-section">工具箱</div>
            <a href="/excel" class="{{ 'active' if request.path == '/excel' else '' }}">
                <span class="nav-icon">📥</span> 数据导入
            </a>
            <a href="/quick-collect" class="{{ 'active' if request.path == '/quick-collect' else '' }}">
                <span class="nav-icon">⚡</span> 快速采集
            </a>
            <a href="/create" class="create-link {{ 'active' if request.path == '/create' else '' }}">
                <span class="nav-icon">✨</span> AI 创作
            </a>
            <a href="/guide" class="guide-link {{ 'active' if request.path == '/guide' else '' }}" style="margin-top:6px;">
                <span class="nav-icon">📖</span> 新手引导
            </a>
        </nav>
        <div class="sidebar-footer">
            可予礼品有限公司<br>
            竞品监控 v2.1
        </div>
    </aside>

    <div class="main">
        {% block content %}{% endblock %}
        <div class="footer-text">
            可予礼品有限公司 · 喜糖伴手礼行业数据平台 · 数据每日 6:00 自动更新
        </div>
    </div>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
