<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>链接已失效 - 可予礼品有限公司</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #FAF7F5;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center; padding: 60px 40px; max-width: 480px;
            background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .icon { font-size: 64px; margin-bottom: 24px; }
        h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 24px; color: #8B2942; margin-bottom: 12px;
        }
        p {
            font-size: 15px; color: #6B6B6B; line-height: 1.8; margin-bottom: 8px;
        }
        .btn {
            display: inline-block; margin-top: 20px; padding: 12px 32px;
            background: #8B2942; color: white; text-decoration: none;
            border-radius: 8px; font-size: 15px; font-weight: 500;
            transition: all 0.2s;
        }
        .btn:hover { background: #A83350; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⏰</div>
        <h1>链接已失效</h1>
        <p>该分享链接已过期或已被撤销。</p>
        <p style="font-size:13px;color:#999;">如需重新获取访问权限，请联系数据管理员。</p>
    </div>
</body>
</html>
