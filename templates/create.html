{% extends "base.html" %}
{% block title %}AI 创作{% endblock %}

{% block extra_head %}
<style>
    /* ===== AI Create Module ===== */
    .ai-create-wrap {
        max-width: 1100px;
        margin: 0 auto;
    }

    /* --- Tab Bar --- */
    .ai-tabs {
        display: flex;
        gap: 0;
        border-bottom: 2px solid var(--border);
        margin-bottom: 28px;
    }
    .ai-tab {
        padding: 14px 28px;
        font-size: 14.5px;
        font-weight: 500;
        cursor: pointer;
        border: none;
        background: none;
        color: var(--text-muted);
        transition: all 0.2s;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        position: relative;
        font-family: inherit;
    }
    .ai-tab:hover { color: var(--text); }
    .ai-tab.active {
        color: var(--brand);
        border-bottom-color: var(--brand);
        font-weight: 600;
    }
    .ai-tab .tab-badge {
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 10px;
        margin-left: 6px;
        background: #E8F5E9;
        color: #2E7D32;
        font-weight: 500;
    }

    /* --- Tab Panels --- */
    .ai-panel { display: none; animation: fadeIn 0.3s ease; }
    .ai-panel.show { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* --- Form Elements --- */
    .ai-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
    }
    .ai-row-3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 16px;
        margin-bottom: 16px;
    }
    .ai-row-4 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
    }

    .ai-field { margin-bottom: 18px; }
    .ai-field label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 6px;
    }
    .ai-field label .label-hint {
        font-weight: 400;
        color: var(--text-muted);
        font-size: 11.5px;
    }
    .ai-field input[type="text"],
    .ai-field textarea,
    .ai-field select {
        width: 100%;
        padding: 11px 14px;
        border: 1.5px solid var(--border);
        border-radius: var(--radius-xs);
        font-size: 13.5px;
        font-family: inherit;
        color: var(--text);
        background: #FFF;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .ai-field textarea { resize: vertical; min-height: 80px; }
    .ai-field input:focus,
    .ai-field textarea:focus,
    .ai-field select:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 3px var(--brand-glow);
    }

    /* --- Model Selector --- */
    .model-select {
        padding: 12px 14px !important;
        font-weight: 500 !important;
    }
    .model-option-recommended { color: var(--brand); font-weight: 600; }
    .model-option { color: var(--text-secondary); }
    .model-option-disabled { color: var(--text-muted); }

    /* --- Buttons --- */
    .ai-btn-generate {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 13px 32px;
        border: none;
        border-radius: var(--radius-xs);
        font-size: 14.5px;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(135deg, var(--brand), var(--brand-light));
        color: #FFF;
        box-shadow: 0 4px 14px rgba(139,41,66,0.25);
        transition: all 0.2s;
        font-family: inherit;
        letter-spacing: 0.3px;
    }
    .ai-btn-generate:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(139,41,66,0.35);
    }
    .ai-btn-generate:disabled {
        opacity: 0.65;
        cursor: not-allowed;
        transform: none;
    }

    .ai-btn-secondary {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 9px 18px;
        border: 1.5px solid var(--border);
        border-radius: var(--radius-xs);
        font-size: 13px;
        cursor: pointer;
        background: #FFF;
        color: var(--text);
        transition: all 0.2s;
        font-family: inherit;
    }
    .ai-btn-secondary:hover {
        border-color: var(--brand);
        color: var(--brand);
        background: #FFF5F7;
    }

    /* --- Loading Spinner --- */
    .loading-spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 2.5px solid rgba(255,255,255,0.3);
        border-top-color: #FFF;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
    }
    .loading-spinner.dark {
        border-color: rgba(0,0,0,0.1);
        border-top-color: var(--brand);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- Result Area --- */
    .ai-result {
        margin-top: 24px;
        display: none;
        animation: fadeIn 0.4s ease;
    }
    .ai-result.show { display: block; }
    .ai-result-model {
        font-size: 11.5px;
        color: var(--text-muted);
        margin-bottom: 14px;
        padding: 4px 10px;
        background: var(--bg-warm);
        border-radius: 4px;
        display: inline-block;
    }

    /* --- Image Result --- */
    .img-preview-wrap {
        max-width: 100%;
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
        border: 1px solid var(--border-light);
    }
    .img-preview-wrap img {
        width: 100%;
        display: block;
    }
    .img-actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
    }

    /* --- Video Result --- */
    .video-preview-wrap {
        max-width: 100%;
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
        border: 1px solid var(--border-light);
    }
    .video-preview-wrap video {
        width: 100%;
        display: block;
        max-height: 420px;
    }
    .video-progress-wrap {
        background: var(--bg-warm);
        border-radius: var(--radius);
        padding: 32px;
        text-align: center;
        border: 1px solid var(--border-light);
    }
    .video-progress-wrap .status-msg {
        font-size: 14px;
        color: var(--text-secondary);
        margin-top: 14px;
    }
    .video-progress-bar-bg {
        width: 100%;
        height: 6px;
        background: var(--border);
        border-radius: 3px;
        margin-top: 16px;
        overflow: hidden;
    }
    .video-progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--brand), var(--gold));
        border-radius: 3px;
        width: 0%;
        animation: progressPulse 2s ease-in-out infinite;
    }
    @keyframes progressPulse {
        0%, 100% { width: 20%; }
        50% { width: 85%; }
    }

    /* --- XHS Card Style --- */
    .xhs-card {
        background: #FFF;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--border-light);
        overflow: hidden;
    }
    .xhs-card-header {
        padding: 20px 24px;
        background: linear-gradient(135deg, #FFF5F7, #FFF0F3);
        border-bottom: 1px solid rgba(232,84,126,0.1);
    }
    .xhs-card-title {
        font-size: 18px;
        font-weight: 700;
        color: #222;
        line-height: 1.5;
    }
    .xhs-card-body {
        padding: 20px 24px;
        font-size: 14px;
        line-height: 1.9;
        color: #333;
    }
    .xhs-card-tags {
        padding: 14px 24px;
        border-top: 1px solid var(--border-light);
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }
    .xhs-tag {
        padding: 4px 12px;
        background: #F0F7FF;
        color: #4A7FE0;
        border-radius: 14px;
        font-size: 12px;
        font-weight: 500;
    }

    /* --- DY Script Table --- */
    .dy-table-wrap {
        overflow-x: auto;
        border-radius: var(--radius);
        border: 1px solid var(--border);
    }
    .dy-table-wrap table {
        font-size: 13px;
        white-space: nowrap;
    }
    .dy-table-wrap td { white-space: normal; min-width: 80px; }
    .dy-table-wrap td.shot-num { min-width: 50px; text-align: center; font-weight: 700; color: var(--brand); }
    .dy-table-wrap td.shot-time { min-width: 60px; text-align: center; color: var(--text-muted); }
    .dy-table-wrap td.shot-hook {
        background: #FFF8EC;
        border-left: 3px solid var(--gold);
    }

    /* --- Copy / Export Bar --- */
    .result-toolbar {
        display: flex;
        gap: 10px;
        margin-top: 16px;
        flex-wrap: wrap;
    }

    /* --- Style Chips --- */
    .style-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }
    .style-chip {
        padding: 7px 14px;
        border: 1.5px solid var(--border);
        border-radius: 20px;
        font-size: 12.5px;
        cursor: pointer;
        background: #FFF;
        color: var(--text-secondary);
        transition: all 0.2s;
        font-family: inherit;
        white-space: nowrap;
    }
    .style-chip:hover {
        border-color: var(--brand);
        color: var(--brand);
    }
    .style-chip.active {
        background: var(--brand);
        color: #FFF;
        border-color: var(--brand);
    }

    /* --- Error --- */
    .ai-error {
        background: #FFF0F0;
        border: 1px solid #FFD0D0;
        border-radius: var(--radius-xs);
        padding: 14px 18px;
        color: #D32F2F;
        font-size: 13px;
        margin-top: 14px;
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .ai-row, .ai-row-3, .ai-row-4 { grid-template-columns: 1fr; }
        .ai-tabs { flex-wrap: wrap; }
        .ai-tab { flex: 1; text-align: center; padding: 12px 10px; font-size: 13px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h2>✨ AI 创作</h2>
    <div class="breadcrumb">AI 智能生成 / 文案 · 图片 · 视频 · 脚本</div>
</div>

<div class="content">
    <div class="ai-create-wrap">

        <!-- ========== Tab Bar ========== -->
        <div class="ai-tabs">
            <button class="ai-tab active" onclick="switchTab('image')" id="tab-image">
                🖼️ AI 生图
            </button>
            <button class="ai-tab" onclick="switchTab('video')" id="tab-video">
                🎬 AI 生视频
                <span class="tab-badge">新</span>
            </button>
            <button class="ai-tab" onclick="switchTab('xhs')" id="tab-xhs">
                📕 小红书文案
            </button>
            <button class="ai-tab" onclick="switchTab('dy')" id="tab-dy">
                🎵 抖音脚本
            </button>
        </div>

        <!-- ================================================================ -->
        <!-- Tab 1: AI 生图 -->
        <!-- ================================================================ -->
        <div class="ai-panel show" id="panel-image">
            <div class="card">
                <div class="card-header"><h3><span class="card-icon">🖼️</span> AI 图片生成</h3></div>

                <div class="ai-field">
                    <label>提示词 <span class="label-hint">（描述你要生成的图片）</span></label>
                    <textarea id="img-prompt" rows="3" placeholder="例如：一款精致的中国风婚礼喜糖礼盒，红色丝绸包装，金色刺绣花纹，柔和光影，产品摄影..."></textarea>
                </div>

                <div class="ai-row-3">
                    <div class="ai-field">
                        <label>图片尺寸</label>
                        <select id="img-size">
                            <option value="1024x1024" selected>1:1 正方形 (1024×1024)</option>
                            <option value="768x1024">3:4 竖版 (768×1024)</option>
                            <option value="1024x576">16:9 横版 (1024×576)</option>
                            <option value="576x1024">9:16 全屏 (576×1024)</option>
                        </select>
                    </div>
                    <div class="ai-field">
                        <label>生成模型</label>
                        <select id="img-model" class="model-select">
                            <option value="flux_schnell" data-recommended="true">☁️ Cloudflare Flux.1 Schnell（推荐 · 300次/天）</option>
                            <option value="sdxl">🎨 Stable Diffusion XL</option>
                            <option value="janus">🤖 DeepSeek Janus</option>
                        </select>
                    </div>
                    <div class="ai-field">
                        <label>图片风格</label>
                        <div class="style-chips" id="img-style-chips">
                            <button class="style-chip active" data-style="写实">📷 写实</button>
                            <button class="style-chip" data-style="插画">🎨 插画</button>
                            <button class="style-chip" data-style="国风">🏮 国风</button>
                            <button class="style-chip" data-style="ins风">📱 ins风</button>
                            <button class="style-chip" data-style="产品图">📦 产品图</button>
                        </div>
                    </div>
                </div>

                <button class="ai-btn-generate" onclick="generateImage()" id="btn-image">
                    🪄 开始生成图片
                </button>

                <div class="ai-result" id="result-image">
                    <div class="ai-result-model" id="result-image-model"></div>
                    <div class="img-preview-wrap">
                        <img id="img-output" src="" alt="AI 生成结果" style="display:none;" />
                    </div>
                    <div class="img-actions">
                        <button class="ai-btn-secondary" onclick="downloadImage()">⬇️ 下载图片</button>
                        <button class="ai-btn-secondary" onclick="copyImageToPublish()">📤 插入发布包</button>
                    </div>
                </div>
                <div class="ai-error" id="error-image" style="display:none;"></div>
            </div>
        </div>

        <!-- ================================================================ -->
        <!-- Tab 2: AI 生视频 -->
        <!-- ================================================================ -->
        <div class="ai-panel" id="panel-video">
            <div class="card">
                <div class="card-header"><h3><span class="card-icon">🎬</span> AI 视频生成</h3></div>

                <div class="ai-field">
                    <label>视频描述 <span class="label-hint">（详细描述视频内容和氛围）</span></label>
                    <textarea id="video-prompt" rows="3" placeholder="例如：中国传统婚礼喜糖礼盒展示，红色包装缓缓打开，金色丝带飘落，糖果散落在丝绸上，温馨光影，慢镜头..."></textarea>
                </div>

                <div class="ai-row-3">
                    <div class="ai-field">
                        <label>视频时长</label>
                        <select id="video-duration">
                            <option value="3秒">3秒</option>
                            <option value="5秒" selected>5秒</option>
                            <option value="10秒">10秒</option>
                        </select>
                    </div>
                    <div class="ai-field">
                        <label>生成模型</label>
                        <select id="video-model" class="model-select">
                            <option value="cogvideo" data-recommended="true">🎬 CogVideoX-2B（推荐 · 免费tier）</option>
                            <option value="svd">📹 Stable Video Diffusion</option>
                        </select>
                    </div>
                    <div class="ai-field">
                        <label>风格</label>
                        <div class="style-chips" id="video-style-chips">
                            <button class="style-chip active" data-style="实拍风">🎥 实拍风</button>
                            <button class="style-chip" data-style="动漫风">✨ 动漫风</button>
                            <button class="style-chip" data-style="产品展示">📦 产品展示</button>
                            <button class="style-chip" data-style="抽象艺术">🎭 抽象艺术</button>
                        </div>
                    </div>
                </div>

                <button class="ai-btn-generate" onclick="generateVideo()" id="btn-video">
                    🎬 开始生成视频
                </button>

                <div class="ai-result" id="result-video">
                    <div class="ai-result-model" id="result-video-model"></div>

                    <!-- Progress -->
                    <div class="video-progress-wrap" id="video-progress" style="display:none;">
                        <div class="loading-spinner dark" style="width:36px;height:36px;"></div>
                        <div class="status-msg" id="video-status-msg">AI 正在生成视频，预计 1-3 分钟...</div>
                        <div class="video-progress-bar-bg">
                            <div class="video-progress-bar-fill"></div>
                        </div>
                    </div>

                    <!-- Preview -->
                    <div class="video-preview-wrap" id="video-preview" style="display:none;">
                        <video id="video-output" controls></video>
                    </div>

                    <div class="img-actions" id="video-actions" style="display:none;">
                        <button class="ai-btn-secondary" onclick="downloadVideo()">⬇️ 下载视频</button>
                    </div>
                </div>
                <div class="ai-error" id="error-video" style="display:none;"></div>
            </div>
        </div>

        <!-- ================================================================ -->
        <!-- Tab 3: 小红书文案 -->
        <!-- ================================================================ -->
        <div class="ai-panel" id="panel-xhs">
            <div class="card">
                <div class="card-header"><h3><span class="card-icon">📕</span> 小红书爆款笔记生成</h3></div>

                <div class="ai-row">
                    <div class="ai-field">
                        <label>产品名称 / 主题 <span style="color:var(--brand);">*</span></label>
                        <input type="text" id="xhs-product" placeholder="例如：喜糖礼盒 / 伴手礼 / 定制请柬" />
                    </div>
                    <div class="ai-field">
                        <label>补充关键词 <span class="label-hint">（可选）</span></label>
                        <input type="text" id="xhs-keywords" placeholder="例如：婚礼 中式 高级感" />
                    </div>
                </div>

                <div class="ai-row-3">
                    <div class="ai-field">
                        <label>内容风格</label>
                        <div class="style-chips" id="xhs-style-chips">
                            <button class="style-chip active" data-style="种草测评">💚 种草测评</button>
                            <button class="style-chip" data-style="好物分享">🎁 好物分享</button>
                            <button class="style-chip" data-style="避坑指南">⚠️ 避坑指南</button>
                            <button class="style-chip" data-style="教程攻略">📖 教程攻略</button>
                            <button class="style-chip" data-style="Vlog脚本">🎥 Vlog脚本</button>
                        </div>
                    </div>
                    <div class="ai-field">
                        <label>文案长度</label>
                        <div class="style-chips" id="xhs-length-chips">
                            <button class="style-chip" data-length="短文案">📝 短 ~150字</button>
                            <button class="style-chip active" data-length="标准">📄 标准 ~300字</button>
                            <button class="style-chip" data-length="长文案">📋 长 ~500字</button>
                        </div>
                    </div>
                    <div class="ai-field">
                        <label>生成模型</label>
                        <select id="xhs-model" class="model-select">
                            <option value="deepseek" data-recommended="true">🔵 DeepSeek V3（推荐）</option>
                            <option value="doubao">🟣 豆包 Pro</option>
                            <option value="qwen">🔷 通义千问 Qwen3</option>
                            <option value="kimi">🟢 Kimi</option>
                            <option value="gemini">🟡 Gemini 2.0 Flash</option>
                            <option value="gpt4o_mini">🟩 GPT-4o-mini</option>
                        </select>
                    </div>
                </div>

                <button class="ai-btn-generate" onclick="generateXhs()" id="btn-xhs">
                    ✍️ 生成小红书文案
                </button>

                <div class="ai-result" id="result-xhs">
                    <div class="ai-result-model" id="result-xhs-model"></div>
                    <div class="xhs-card">
                        <div class="xhs-card-header">
                            <div class="xhs-card-title" id="xhs-output-title"></div>
                        </div>
                        <div class="xhs-card-body" id="xhs-output-body"></div>
                        <div class="xhs-card-tags" id="xhs-output-tags"></div>
                    </div>
                    <div class="result-toolbar">
                        <button class="ai-btn-secondary" onclick="copyXhs()">📋 复制全文</button>
                        <button class="ai-btn-secondary" onclick="copyXhsTitle()">📌 复制标题</button>
                        <button class="ai-btn-secondary" onclick="copyXhsTags()">🏷️ 复制标签</button>
                    </div>
                </div>
                <div class="ai-error" id="error-xhs" style="display:none;"></div>
            </div>
        </div>

        <!-- ================================================================ -->
        <!-- Tab 4: 抖音脚本 -->
        <!-- ================================================================ -->
        <div class="ai-panel" id="panel-dy">
            <div class="card">
                <div class="card-header"><h3><span class="card-icon">🎵</span> 抖音爆款脚本生成</h3></div>

                <div class="ai-field">
                    <label>产品名称 / 主题 <span style="color:var(--brand);">*</span></label>
                    <input type="text" id="dy-product" placeholder="例如：喜糖礼盒 / 伴手礼开箱 / 婚礼好物推荐" />
                </div>

                <div class="ai-row-3">
                    <div class="ai-field">
                        <label>脚本风格</label>
                        <div class="style-chips" id="dy-type-chips">
                            <button class="style-chip active" data-style="开箱测评">📦 开箱测评</button>
                            <button class="style-chip" data-style="教程干货">📖 教程干货</button>
                            <button class="style-chip" data-style="剧情反转">🎭 剧情反转</button>
                            <button class="style-chip" data-style="对比挑战">⚡ 对比挑战</button>
                            <button class="style-chip" data-style="情感共鸣">💕 情感共鸣</button>
                        </div>
                    </div>
                    <div class="ai-field">
                        <label>时长模板</label>
                        <div class="style-chips" id="dy-duration-chips">
                            <button class="style-chip" data-duration="15秒">⏱️ 15秒（3镜）</button>
                            <button class="style-chip active" data-duration="30秒">⏱️ 30秒（5镜）</button>
                            <button class="style-chip" data-duration="60秒">⏱️ 60秒（8镜）</button>
                        </div>
                    </div>
                    <div class="ai-field">
                        <label>生成模型</label>
                        <select id="dy-model" class="model-select">
                            <option value="deepseek" data-recommended="true">🔵 DeepSeek V3（推荐）</option>
                            <option value="doubao">🟣 豆包 Pro</option>
                            <option value="qwen">🔷 通义千问 Qwen3</option>
                            <option value="kimi">🟢 Kimi</option>
                            <option value="gemini">🟡 Gemini 2.0 Flash</option>
                            <option value="gpt4o_mini">🟩 GPT-4o-mini</option>
                        </select>
                    </div>
                </div>

                <button class="ai-btn-generate" onclick="generateDy()" id="btn-dy">
                    🎬 生成抖音脚本
                </button>

                <div class="ai-result" id="result-dy">
                    <div class="ai-result-model" id="result-dy-model"></div>
                    <div class="dy-table-wrap" id="dy-output-table"></div>
                    <div class="result-toolbar">
                        <button class="ai-btn-secondary" onclick="copyDy()">📋 复制完整脚本</button>
                        <button class="ai-btn-secondary" onclick="exportDyMarkdown()">📥 导出 Markdown</button>
                    </div>
                </div>
                <div class="ai-error" id="error-dy" style="display:none;"></div>
            </div>
        </div>

    </div><!-- /ai-create-wrap -->
</div><!-- /content -->
{% endblock %}

{% block extra_scripts %}
<script>
// ==================== State ====================
let currentTab = 'image';
let imgStyle = '写实';
let videoStyle = '实拍风';
let xhsStyle = '种草测评';
let xhsLength = '标准';
let dyStyle = '开箱测评';
let dyDuration = '30秒';
let videoPollInterval = null;

// ==================== Tab Switch ====================
function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.ai-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.ai-panel').forEach(p => p.classList.remove('show'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('panel-' + tab).classList.add('show');
}

// ==================== Style Chips ====================
document.addEventListener('DOMContentLoaded', () => {
    setupStyleChips('img-style-chips', (v) => { imgStyle = v; });
    setupStyleChips('video-style-chips', (v) => { videoStyle = v; });
    setupStyleChips('xhs-style-chips', (v) => { xhsStyle = v; });
    setupStyleChips('xhs-length-chips', (v) => { xhsLength = v; });
    setupStyleChips('dy-type-chips', (v) => { dyStyle = v; });
    setupStyleChips('dy-duration-chips', (v) => { dyDuration = v; });
});

function setupStyleChips(containerId, callback) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.querySelectorAll('.style-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            container.querySelectorAll('.style-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            callback(chip.dataset.style || chip.dataset.length || chip.dataset.duration);
        });
    });
}

// ==================== Helpers ====================
function showResult(panelId, show=true) {
    const el = document.getElementById('result-' + panelId);
    if (el) { el.classList.toggle('show', show); }
}

function showError(panelId, msg) {
    const el = document.getElementById('error-' + panelId);
    if (el) { el.style.display = msg ? 'block' : 'none'; el.textContent = msg; }
}

function showModelTag(panelId, text) {
    const el = document.getElementById('result-' + panelId + '-model');
    if (el) { el.textContent = '🧠 ' + text; el.style.display = text ? 'inline-block' : 'none'; }
}

async function copyToClipboard(text) {
    try {
        await navigator.clipboard.writeText(text);
        // Quick toast feedback
        return true;
    } catch(e) {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        return true;
    }
}

function getModelEmoji(modelId) {
    const map = { deepseek:'🔵', doubao:'🟣', qwen:'🔷', kimi:'🟢', gemini:'🟡', gpt4o_mini:'🟩',
                  flux_schnell:'☁️', janus:'🤖', sdxl:'🎨', cogvideo:'🎬', svd:'📹' };
    return map[modelId] || '🤖';
}

// ================================================================
// Tab 1: AI 生图
// ================================================================
async function generateImage() {
    const prompt = document.getElementById('img-prompt').value;
    if (!prompt) { showError('image', '请输入提示词'); return; }

    const btn = document.getElementById('btn-image');
    btn.innerHTML = '<span class="loading-spinner"></span> AI 正在生成...';
    btn.disabled = true;
    showError('image', '');
    showResult('image', false);

    try {
        const modelEl = document.getElementById('img-model');
        const model = modelEl.value;

        const resp = await fetch('/api/ai/image', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                prompt: prompt,
                style: imgStyle,
                size: document.getElementById('img-size').value,
                model: model,
            })
        });
        const data = await resp.json();

        if (data.success) {
            const img = document.getElementById('img-output');
            img.src = data.image_url;
            img.style.display = 'block';
            showResult('image', true);
            showModelTag('image', getModelEmoji(model) + ' ' + (data.engine || 'AI'));
        } else {
            showError('image', data.error || '生成失败，请重试');
        }
    } catch(e) {
        showError('image', '网络错误: ' + e.message);
    }
    btn.innerHTML = '🪄 开始生成图片';
    btn.disabled = false;
}

function downloadImage() {
    const img = document.getElementById('img-output');
    if (!img.src) return;
    const a = document.createElement('a');
    a.href = img.src;
    a.download = 'ai-image-' + Date.now() + '.png';
    a.click();
}

function copyImageToPublish() {
    switchTab('xhs');
}

// ================================================================
// Tab 2: AI 生视频
// ================================================================
async function generateVideo() {
    const prompt = document.getElementById('video-prompt').value;
    if (!prompt) { showError('video', '请输入视频描述'); return; }

    const btn = document.getElementById('btn-video');
    btn.innerHTML = '<span class="loading-spinner"></span> 提交中...';
    btn.disabled = true;
    showError('video', '');
    showResult('video', false);

    // Hide old results
    document.getElementById('video-preview').style.display = 'none';
    document.getElementById('video-actions').style.display = 'none';

    try {
        const modelEl = document.getElementById('video-model');
        const model = modelEl.value;

        const resp = await fetch('/api/ai/video', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                prompt: prompt,
                duration: document.getElementById('video-duration').value,
                style: videoStyle,
                model: model,
            })
        });
        const data = await resp.json();

        if (data.success) {
            showResult('video', true);
            showModelTag('video', getModelEmoji(model) + ' ' + (data.engine || 'AI'));

            // Show progress
            const progressEl = document.getElementById('video-progress');
            progressEl.style.display = 'block';
            document.getElementById('video-status-msg').textContent = 'AI 正在生成视频，预计 1-3 分钟...';

            // Start polling
            startVideoPolling(data.task_id);
        } else {
            showError('video', data.error || '视频引擎未配置。请在 Railway Variables 中添加 HF_API_KEY');
        }
    } catch(e) {
        showError('video', '网络错误: ' + e.message);
    }
    btn.innerHTML = '🎬 开始生成视频';
    btn.disabled = false;
}

function startVideoPolling(taskId) {
    if (videoPollInterval) clearInterval(videoPollInterval);

    videoPollInterval = setInterval(async () => {
        try {
            const resp = await fetch('/api/ai/video_status/' + taskId);
            const data = await resp.json();

            if (data.status === 'completed') {
                clearInterval(videoPollInterval);
                videoPollInterval = null;

                document.getElementById('video-progress').style.display = 'none';
                const videoEl = document.getElementById('video-output');
                videoEl.src = data.video_url;
                document.getElementById('video-preview').style.display = 'block';
                document.getElementById('video-actions').style.display = 'flex';
            } else if (data.status === 'failed') {
                clearInterval(videoPollInterval);
                videoPollInterval = null;
                document.getElementById('video-progress').style.display = 'none';
                showError('video', data.error || '视频生成失败');
            } else {
                document.getElementById('video-status-msg').textContent = data.message || '正在生成中...';
            }
        } catch(e) {
            // Ignore polling errors
        }
    }, 5000); // poll every 5s
}

function downloadVideo() {
    const video = document.getElementById('video-output');
    if (!video.src) return;
    const a = document.createElement('a');
    a.href = video.src;
    a.download = 'ai-video-' + Date.now() + '.mp4';
    a.click();
}

// ================================================================
// Tab 3: 小红书文案
// ================================================================
async function generateXhs() {
    const product = document.getElementById('xhs-product').value;
    if (!product) { showError('xhs', '请输入产品名称'); return; }

    const btn = document.getElementById('btn-xhs');
    btn.innerHTML = '<span class="loading-spinner"></span> AI 创作中...';
    btn.disabled = true;
    showError('xhs', '');
    showResult('xhs', false);

    try {
        const modelEl = document.getElementById('xhs-model');
        const model = modelEl.value;

        const resp = await fetch('/api/ai/xiaohongshu', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                product: product,
                style: xhsStyle,
                length: xhsLength,
                keywords: document.getElementById('xhs-keywords').value,
                model: model,
            })
        });
        const data = await resp.json();

        if (data.success) {
            showResult('xhs', true);
            showModelTag('xhs', data.model_used || 'AI');

            // Render
            document.getElementById('xhs-output-title').textContent = data.title || '';
            document.getElementById('xhs-output-body').innerHTML = (data.body || data.full || '').replace(/\n/g, '<br>');

            // Tags
            const tagsEl = document.getElementById('xhs-output-tags');
            const tags = (data.tags || '').split('#').filter(t => t.trim());
            tagsEl.innerHTML = tags.map(t => '<span class="xhs-tag">#' + t.trim() + '</span>').join('');

            // Store for copy
            document.getElementById('xhs-output-title').dataset.full = data.full || '';
        } else {
            showError('xhs', data.error || '生成失败');
        }
    } catch(e) {
        showError('xhs', '网络错误: ' + e.message);
    }
    btn.innerHTML = '✍️ 生成小红书文案';
    btn.disabled = false;
}

function copyXhs() {
    const full = document.getElementById('xhs-output-title').dataset.full ||
        document.getElementById('xhs-output-title').textContent + '\n\n' +
        document.getElementById('xhs-output-body').innerText + '\n\n' +
        document.getElementById('xhs-output-tags').innerText;
    copyToClipboard(full).then(() => alert('已复制全文！'));
}

function copyXhsTitle() {
    copyToClipboard(document.getElementById('xhs-output-title').textContent).then(() => alert('已复制标题！'));
}

function copyXhsTags() {
    copyToClipboard(document.getElementById('xhs-output-tags').innerText).then(() => alert('已复制标签！'));
}

// ================================================================
// Tab 4: 抖音脚本
// ================================================================
async function generateDy() {
    const product = document.getElementById('dy-product').value;
    if (!product) { showError('dy', '请输入产品名称'); return; }

    const btn = document.getElementById('btn-dy');
    btn.innerHTML = '<span class="loading-spinner"></span> AI 创作中...';
    btn.disabled = true;
    showError('dy', '');
    showResult('dy', false);

    try {
        const modelEl = document.getElementById('dy-model');
        const model = modelEl.value;

        const resp = await fetch('/api/ai/douyin', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                product: product,
                style: dyStyle,
                duration: dyDuration,
                model: model,
            })
        });
        const data = await resp.json();

        if (data.success) {
            showResult('dy', true);
            showModelTag('dy', data.model_used || 'AI');

            // Render
            document.getElementById('dy-output-table').innerHTML = renderDyScript(data.full || '');
        } else {
            showError('dy', data.error || '生成失败');
        }
    } catch(e) {
        showError('dy', '网络错误: ' + e.message);
    }
    btn.innerHTML = '🎬 生成抖音脚本';
    btn.disabled = false;
}

function renderDyScript(text) {
    // Try to parse markdown table
    const lines = text.split('\n');
    let tableHtml = '<table><thead><tr><th>镜号</th><th>时长</th><th>画面描述</th><th>台词/旁白</th><th>备注</th></tr></thead><tbody>';
    let inTable = false;
    let extraHtml = '';

    for (const line of lines) {
        const trimmed = line.trim();
        if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
            // Table row
            const cells = trimmed.split('|').filter(c => c.trim());
            if (cells.length >= 3) {
                // Skip separator row
                if (cells.every(c => c.trim().match(/^[-:]+$/))) continue;
                inTable = true;
                const isHook = cells.some(c => c.includes('Hook') || c.includes('hook'));
                tableHtml += '<tr>';
                for (let i = 0; i < Math.min(cells.length, 5); i++) {
                    const cellClass = (i === 0 && isHook) ? 'shot-num shot-hook' : (i === 1 ? 'shot-time' : '');
                    tableHtml += '<td class="' + cellClass + '">' + cells[i].trim() + '</td>';
                }
                tableHtml += '</tr>';
            }
        } else if (trimmed.startsWith('🎵') || trimmed.startsWith('🏷️') || trimmed.startsWith('BGM') || trimmed.startsWith('#')) {
            extraHtml += '<div style="padding:12px 16px;font-size:13px;color:var(--text-secondary);border-top:1px solid var(--border-light);">' + trimmed + '</div>';
        } else if (inTable && trimmed === '') {
            break;
        }
    }
    tableHtml += '</tbody></table>';

    return tableHtml + extraHtml;
}

function copyDy() {
    const tableEl = document.getElementById('dy-output-table');
    const fullText = tableEl ? tableEl.innerText : '';
    copyToClipboard(fullText).then(() => alert('已复制脚本！'));
}

function exportDyMarkdown() {
    const tableEl = document.getElementById('dy-output-table');
    let md = '# 抖音拍摄脚本\n\n';

    // Convert HTML table to markdown
    const rows = tableEl.querySelectorAll('tr');
    rows.forEach((row, idx) => {
        const cells = row.querySelectorAll('th, td');
        const cellContents = Array.from(cells).map(c => c.innerText.trim());
        md += '| ' + cellContents.join(' | ') + ' |\n';
        if (idx === 0) {
            md += '| ' + cellContents.map(() => '---').join(' | ') + ' |\n';
        }
    });

    // Add remaining text
    const extras = tableEl.querySelectorAll('div');
    extras.forEach(div => { md += '\n' + div.innerText.trim() + '\n'; });

    const blob = new Blob([md], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'douyin-script-' + Date.now() + '.md';
    a.click();
    URL.revokeObjectURL(url);
}
</script>
