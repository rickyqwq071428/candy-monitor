[taobao]
# API模式: manual(手动) / personal(个人开发者-仅基础字段) / enterprise(企业开发者-全量字段)
api_mode = manual
app_key = your_app_key_here
app_secret = your_app_secret_here

# ==============================
# 淘宝API密钥申请指南
# ==============================
# 
# 方案A：个人开发者API（仅需身份证实名认证）
#   1. 访问 https://open.taobao.com 注册（选择"个人开发者"）
#   2. 完成身份证实名认证
#   3. 创建应用 → 获取 AppKey 和 AppSecret
#   4. 注意：个人模式只能获取标题、主图、一口价，无销量/SKU/库存
#
# 方案B：生意参谋免费版（推荐，无需API密钥）
#   1. 在淘宝免费开一个个人店铺
#   2. 访问 https://sycm.taobao.com 登录
#   3. 使用"行业排行"→"买家画像"→"搜索词分析"等功能
#   4. 数据直接复制粘贴到 Excel 模板即可
#
# 方案C：阿里指数（零门槛，120小时内新用户免费）
#   1. 访问 https://index.1688.com
#   2. 搜索喜糖/伴手礼关键词
#   3. 获取搜索指数、采购指数、买家画像、热门地区
#   4. 免费版有使用次数限制，数据足够参考
#
# 方案D：淘宝搜索页快速采集书签
#   1. 浏览器新建书签，URL设为以下JavaScript代码
#   2. 在淘宝搜索页点击书签，自动提取当前页Top商品数据到剪贴板
#   3. 粘贴到 Excel 模板后上传即可
#   4. 代码见 quick_collect 页面

[schedule]
# 定时采集调度
auto_collect = true
collect_day = monday
collect_hour = 6
collect_minute = 0

[app]
name = 可予礼品有限公司
brand_color = #8B2942
gold_color = #C9A961
debug = true
host = 127.0.0.1
port = 5000
