# 可予礼品竞品监控平台 - Nginx 配置（独立 VPS 部署用）
# 使用: 替换 your-domain.com 为实际域名，放到 /etc/nginx/sites-available/

server {
    listen 80;
    server_name your-domain.com;   # 替换为你的域名，或用 _ 匹配所有

    # 访问日志
    access_log /var/log/nginx/candy_monitor_access.log;
    error_log  /var/log/nginx/candy_monitor_error.log;

    # 上传限制（Excel 导入）
    client_max_body_size 50M;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态文件缓存
    location /static/ {
        alias /opt/candy_monitor/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Flask 应用代理
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # 健康检查（不记录日志）
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        access_log off;
    }

    # 禁止访问敏感文件
    location ~ /\. {
        deny all;
    }
    location ~ \.db$ {
        deny all;
    }
}
