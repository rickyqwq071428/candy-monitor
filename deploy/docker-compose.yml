# 可予礼品竞品监控平台 - Docker Compose
# 启动: docker compose up -d
# 查看: docker compose logs -f
# 停止: docker compose down

version: '3.8'

services:
  candy-monitor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: candy-monitor
    restart: always
    ports:
      - "5000:5000"
    environment:
      - CANDY_HOST=0.0.0.0
      - CANDY_PORT=5000
      - CANDY_THREADS=4
      - CANDY_DEBUG=false
    volumes:
      # 持久化数据库
      - candy_data:/app/data
      # 如果想保留导入数据，也挂载数据库文件
      - ../candy_monitor.db:/app/candy_monitor.db
    networks:
      - candy_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: candy-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../static:/app/static:ro
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - candy-monitor
    networks:
      - candy_net

  # Certbot 自动续签（可选）
  certbot:
    image: certbot/certbot
    container_name: candy-certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - candy_net

networks:
  candy_net:
    driver: bridge

volumes:
  candy_data:
  certbot_data:
  certbot_www:
